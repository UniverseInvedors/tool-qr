@keyframes toastIn{from{opacity:0;transform:translateY(8px) scale(.95)}to{opacity:1;transform:translateY(0) scale(1)}}

<script>
var currentMode='text'

function setMode(mode){
  currentMode=mode
  document.querySelectorAll('.qr-panel').forEach(function(p){p.classList.remove('active')})
  document.querySelectorAll('.et').forEach(function(t){t.classList.remove('active')})
  var panel=document.getElementById('qr-'+mode)
  var btn=document.getElementById('et-'+mode)
  if(panel)panel.classList.add('active')
  if(btn)btn.classList.add('active')
  generate()
}

function getQRData(){
  if(currentMode==='text'){
    return document.getElementById('qr-text-input').value||''
  }else if(currentMode==='wifi'){
    var ssid=document.getElementById('qr-wifi-ssid').value
    var pass=document.getElementById('qr-wifi-pass').value
    var enc=document.getElementById('qr-wifi-enc').value
    if(!ssid)return''
    return'WIFI:T:'+enc+';S:'+ssid+';P:'+pass+';;'
  }else if(currentMode==='vcard'){
    var f=document.getElementById('qr-vcard-first').value
    var l=document.getElementById('qr-vcard-last').value
    if(!f&&!l)return''
    return'BEGIN:VCARD\nVERSION:3.0\nFN:'+f+' '+l+'\nN:'+l+';'+f+';;;\n'+
      (document.getElementById('qr-vcard-phone').value?'TEL:'+document.getElementById('qr-vcard-phone').value+'\n':'')+
      (document.getElementById('qr-vcard-email').value?'EMAIL:'+document.getElementById('qr-vcard-email').value+'\n':'')+
      (document.getElementById('qr-vcard-company').value?'ORG:'+document.getElementById('qr-vcard-company').value+'\n':'')+
      (document.getElementById('qr-vcard-url').value?'URL:'+document.getElementById('qr-vcard-url').value+'\n':'')+
      'END:VCARD'
  }else if(currentMode==='email'){
    var to=document.getElementById('qr-email-to').value
    if(!to)return''
    var subject=document.getElementById('qr-email-subject').value
    var body=document.getElementById('qr-email-body').value
    return'mailto:'+to+'?subject='+encodeURIComponent(subject)+'&body='+encodeURIComponent(body)
  }else if(currentMode==='sms'){
    var phone=document.getElementById('qr-sms-phone').value
    if(!phone)return''
    var msg=document.getElementById('qr-sms-msg').value
    return'smsto:'+phone+':'+msg
  }
  return''
}

function generate(){
  var data=getQRData()
  var canvas=document.getElementById('qr-canvas')
  var status=document.getElementById('qr-status')
  if(!data){
    status.textContent='Enter data to generate QR code…'
    status.style.color='var(--t3)'
    var ctx=canvas.getContext('2d')
    ctx.clearRect(0,0,canvas.width,canvas.height)
    return
  }
  var size=parseInt(document.getElementById('qr-size').value)
  var fg=document.getElementById('qr-fg').value
  var bg=document.getElementById('qr-bg').value
  var ec=document.getElementById('qr-ec').value
  document.getElementById('qr-size-label').textContent=size+'px'
  canvas.width=size;canvas.height=size

  if(typeof QRCode==='undefined'){
    status.textContent='QR library loading…';return
  }
  QRCode.toCanvas(canvas,data,{
    width:size,
    margin:2,
    color:{dark:fg,light:bg},
    errorCorrectionLevel:ec
  },function(err){
    if(err){
      status.textContent='Error: '+err.message
      status.style.color='#f87171'
    }else{
      status.textContent='✓ QR code generated — '+data.length+' chars'
      status.style.color='var(--green)'
    }
  })
}

function downloadPNG(){
  var canvas=document.getElementById('qr-canvas')
  if(!canvas.toDataURL)return
  var a=document.createElement('a')
  a.download='qr-code.png'
  a.href=canvas.toDataURL('image/png')
  a.click()
  saveToHistory()
  toast('PNG downloaded','ok')
}

function downloadSVG(){
  var data=getQRData()
  if(!data){toast('Generate a QR first','err');return}
  if(typeof QRCode==='undefined'){toast('QR library not loaded','err');return}
  QRCode.toString(data,{type:'svg',color:{dark:document.getElementById('qr-fg').value,light:document.getElementById('qr-bg').value},margin:2},function(err,url){
    if(err){toast('SVG error: '+err.message,'err');return}
    var a=document.createElement('a')
    a.download='qr-code.svg'
    a.href='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(url)
    a.click()
    toast('SVG downloaded','ok')
  })
}

// QR History — localStorage
function saveToHistory(){
  var data=getQRData()
  if(!data)return
  var canvas=document.getElementById('qr-canvas')
  var thumbnail=canvas.toDataURL('image/png')
  var history=JSON.parse(localStorage.getItem('ui_qr_history')||'[]')
  // Avoid duplicates
  if(history.find(function(h){return h.data===data}))return
  history.unshift({data:data,mode:currentMode,thumbnail:thumbnail,date:new Date().toLocaleDateString()})
  if(history.length>20)history.pop()
  localStorage.setItem('ui_qr_history',JSON.stringify(history))
  renderHistory()
}
function renderHistory(){
  var history=JSON.parse(localStorage.getItem('ui_qr_history')||'[]')
  var el=document.getElementById('qr-history-list')
  if(!el)return
  if(!history.length){el.innerHTML='<p style="font-size:.75rem;color:var(--text-3);padding:.5rem 0">No QR codes generated yet.</p>';return}
  el.innerHTML=history.map(function(h,i){
    var label=h.data.length>40?h.data.slice(0,40)+'…':h.data
    return'<div style="display:flex;align-items:center;gap:.6rem;padding:.4rem 0;border-bottom:1px solid var(--border)">'+
      '<img src="'+h.thumbnail+'" style="width:40px;height:40px;border-radius:4px;background:#fff;padding:2px" alt="QR"/>'+
      '<div style="flex:1;min-width:0"><div style="font-size:.75rem;color:var(--text-1);overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+h.data.replace(/</g,'&lt;')+'</div>'+
      '<div style="font-size:.67rem;color:var(--text-3)">'+h.mode+' · '+h.date+'</div></div>'+
      '<button onclick="loadFromHistory('+i+')" style="background:none;border:none;color:var(--accent-light);font-size:.72rem;cursor:pointer;flex-shrink:0">Load</button>'+
      '<button onclick="deleteHistory('+i+')" style="background:none;border:none;color:#f87171;font-size:.72rem;cursor:pointer;flex-shrink:0">×</button>'+
      '</div>'
  }).join('')
}
function loadFromHistory(i){
  var history=JSON.parse(localStorage.getItem('ui_qr_history')||'[]')
  var h=history[i];if(!h)return
  setMode(h.mode)
  // Try to fill the main text input
  var textInput=document.getElementById('qr-text-input')
  if(textInput)textInput.value=h.data
  generate()
  toast('QR loaded from history','ok')
}
function deleteHistory(i){
  var history=JSON.parse(localStorage.getItem('ui_qr_history')||'[]')
  history.splice(i,1)
  localStorage.setItem('ui_qr_history',JSON.stringify(history))
  renderHistory()
}
function clearHistory(){
  localStorage.removeItem('ui_qr_history')
  renderHistory()
  toast('History cleared','ok')
}

function copyQR(){
  var canvas=document.getElementById('qr-canvas')
  canvas.toBlob(function(blob){
    navigator.clipboard.write([new ClipboardItem({'image/png':blob})]).then(function(){toast('QR copied to clipboard','ok')}).catch(function(){toast('Copy not supported in this browser','err')})
  })
}

function toast(msg,type){var e=document.createElement('div');e.className='toast'+(type?' '+type:'');e.textContent=msg;document.getElementById('toasts').appendChild(e);setTimeout(function(){e.remove()},2800)}
</script>

<script>
window.__TOUR_STEPS__ = [{sel:".topbar-logo",title:"Welcome to QR Generator",body:"Create QR codes for URLs, WiFi passwords, business cards, email and SMS � all free, no sign-up required.",tip:"bottom"},{sel:".etabs",title:"5 QR types",body:"Switch between Text/URL, WiFi, vCard, Email, and SMS modes. Each mode shows the right input fields automatically.",tip:"bottom"},{sel:".container",title:"Fill in your details",body:"Enter your data � the QR code regenerates automatically on every keystroke. No button to click.",tip:"top"},{sel:"#qr-canvas",title:"Your QR code",body:"The QR code previews here in real time. Customise foreground/background colours and size using the style row below.",tip:"top"},{sel:".qr-controls",title:"Download or copy",body:"Download as PNG or SVG, or copy directly to clipboard. SVG export is infinitely scalable � perfect for printing.",tip:"top"}];
</script>
<script>
(function(){
  'use strict';
  var TOUR_KEY='ui_tour_'+(location.hostname.split('.')[0]||'tool');
  var steps=window.__TOUR_STEPS__||[];
  var current=0,active=false;
  var overlay,tipEl;

  function init(){
    if(!steps.length)return;
    overlay=document.createElement('div');
    overlay.id='tour-overlay';
    overlay.setAttribute('role','dialog');
    overlay.setAttribute('aria-modal','true');
    overlay.setAttribute('aria-label','Guided tour');

    var svgNS='http://www.w3.org/2000/svg';
    var svgEl=document.createElementNS(svgNS,'svg');
    svgEl.id='tour-svg';
    svgEl.style.cssText='position:fixed;inset:0;width:100%;height:100%;z-index:9001;pointer-events:none';
    var defs=document.createElementNS(svgNS,'defs');
    var clip=document.createElementNS(svgNS,'clipPath');
    clip.id='tour-clip';
    var outerR=document.createElementNS(svgNS,'rect');
    outerR.setAttribute('width','200%');outerR.setAttribute('height','200%');
    var holeR=document.createElementNS(svgNS,'rect');
    holeR.id='tour-hole';
    clip.appendChild(outerR);clip.appendChild(holeR);defs.appendChild(clip);
    var dimR=document.createElementNS(svgNS,'rect');
    dimR.setAttribute('width','200%');dimR.setAttribute('height','200%');
    dimR.setAttribute('clip-path','url(#tour-clip)');
    dimR.setAttribute('fill','rgba(3,5,10,0.78)');
    var glowR=document.createElementNS(svgNS,'rect');
    glowR.id='tour-glow';
    glowR.setAttribute('fill','none');
    glowR.setAttribute('stroke','rgba(59,130,246,0.55)');
    glowR.setAttribute('stroke-width','2');
    svgEl.appendChild(defs);svgEl.appendChild(dimR);svgEl.appendChild(glowR);
    overlay.appendChild(svgEl);

    tipEl=document.createElement('div');
    tipEl.id='tour-tip';
    tipEl.innerHTML=
      '<div class="tour-progress"><div class="tour-progress-fill" id="tour-pfill"></div></div>'+
      '<div class="tour-step-label" id="tour-slbl"></div>'+
      '<div class="tour-tip-title" id="tour-ttl"></div>'+
      '<div class="tour-tip-body" id="tour-tbdy"></div>'+
      '<div class="tour-footer">'+
        '<div class="tour-dots" id="tour-dots"></div>'+
        '<div class="tour-nav">'+
          '<button class="tour-nav-btn tour-prev" id="tour-prev" onclick="__tourPrev()" aria-label="Previous">&#8592; Prev</button>'+
          '<button class="tour-nav-btn tour-next" id="tour-next" onclick="__tourNext()" aria-label="Next">Next &#8594;</button>'+
        '</div>'+
      '</div>'+
      '<button class="tour-skip" onclick="endTour()">Skip tour &times;</button>';
    overlay.appendChild(tipEl);
    document.body.appendChild(overlay);

    overlay.addEventListener('click',function(e){if(e.target===overlay)endTour();});
    document.addEventListener('keydown',function(e){
      if(!active)return;
      if(e.key==='Escape')endTour();
      if(e.key==='ArrowRight'||e.key==='Enter')__tourNext();
      if(e.key==='ArrowLeft')__tourPrev();
    });

    renderDots();
    var seen=localStorage.getItem(TOUR_KEY);
    if(!seen)setTimeout(function(){startTour();},1500);
  }

  function renderDots(){
    var d=document.getElementById('tour-dots');
    if(!d)return;
    d.innerHTML=steps.map(function(_,i){
      return'<div class="tour-dot'+(i===current?' active':'')+'" onclick="__tourGo('+i+')" tabindex="0" role="button" aria-label="Step '+(i+1)+'"></div>';
    }).join('');
  }

  function spotlight(el){
    if(!el)return;
    var r=el.getBoundingClientRect(),p=10,rx=10;
    var x=r.left-p,y=r.top-p,w=r.width+p*2,h=r.height+p*2;
    var hole=document.getElementById('tour-hole');
    var glow=document.getElementById('tour-glow');
    if(hole){hole.setAttribute('x',x);hole.setAttribute('y',y);hole.setAttribute('width',w);hole.setAttribute('height',h);hole.setAttribute('rx',rx);}
    if(glow){glow.setAttribute('x',x);glow.setAttribute('y',y);glow.setAttribute('width',w);glow.setAttribute('height',h);glow.setAttribute('rx',rx);}
    el.scrollIntoView({behavior:'smooth',block:'nearest',inline:'nearest'});
  }

  function positionTip(el,side){
    if(!tipEl||!el)return;
    tipEl.className='';
    var r=el.getBoundingClientRect();
    var tw=tipEl.offsetWidth||320,th=tipEl.offsetHeight||220;
    var vw=window.innerWidth,vh=window.innerHeight,m=16;
    var top,left,arrow;
    if(side==='bottom'&&r.bottom+th+m<vh){top=r.bottom+m;left=r.left;arrow='top';}
    else if(side==='top'&&r.top-th-m>0){top=r.top-th-m;left=r.left;arrow='bottom';}
    else if(side==='right'&&r.right+tw+m<vw){top=r.top;left=r.right+m;arrow='left';}
    else if(side==='left'&&r.left-tw-m>0){top=r.top;left=r.left-tw-m;arrow='right';}
    else{top=Math.min(r.bottom+m,vh-th-m);left=r.left;arrow='top';}
    left=Math.max(m,Math.min(left,vw-tw-m));
    top=Math.max(m+56,Math.min(top,vh-th-m));
    tipEl.style.top=top+'px';tipEl.style.left=left+'px';
    tipEl.classList.add('arrow-'+arrow);
  }

  function renderStep(idx){
    if(idx<0||idx>=steps.length)return;
    current=idx;
    var step=steps[idx],total=steps.length;
    var el=step.sel?document.querySelector(step.sel):null;
    document.getElementById('tour-slbl').textContent='Step '+(idx+1)+' of '+total;
    document.getElementById('tour-ttl').textContent=step.title||'';
    document.getElementById('tour-tbdy').textContent=step.body||'';
    var pf=document.getElementById('tour-pfill');
    if(pf)pf.style.width=Math.round(((idx+1)/total)*100)+'%';
    var prev=document.getElementById('tour-prev');
    var next=document.getElementById('tour-next');
    if(prev)prev.style.display=idx===0?'none':'';
    if(next)next.textContent=idx===total-1?'Finish \u2713':'Next \u2192';
    document.querySelectorAll('.tour-dot').forEach(function(d,i){d.classList.toggle('active',i===idx);});
    if(el){
      spotlight(el);
      setTimeout(function(){positionTip(el,step.tip||'bottom');},80);
    }else{
      var hole=document.getElementById('tour-hole');
      if(hole){hole.setAttribute('width','0');hole.setAttribute('height','0');}
      tipEl.style.top='50%';tipEl.style.left='50%';
      tipEl.style.transform='translate(-50%,-50%)';
    }
  }

  window.__tourGo=function(i){if(active)renderStep(i);};
  window.__tourNext=function(){if(!active)return;if(current>=steps.length-1){endTour();return;}renderStep(current+1);};
  window.__tourPrev=function(){if(active&&current>0)renderStep(current-1);};

  window.startTour=function(){
    if(!steps.length)return;
    active=true;current=0;
    overlay.classList.add('active');
    document.body.style.overflow='hidden';
    renderStep(0);
  };

  window.endTour=function(){
    active=false;
    if(overlay)overlay.classList.remove('active');
    document.body.style.overflow='';
    localStorage.setItem(TOUR_KEY,'1');
  };

  window.resetTour=function(){localStorage.removeItem(TOUR_KEY);};

  if(document.readyState==='loading'){
    document.addEventListener('DOMContentLoaded',init);
  }else{
    setTimeout(init,0);
  }
})();

</script>
</body>
