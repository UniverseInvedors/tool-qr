<script>
var currentMode='text'

function setMode(mode){
  currentMode=mode
  document.querySelectorAll('.qr-panel').forEach(function(p){p.classList.remove('active')})
  document.querySelectorAll('.et').forEach(function(t){t.classList.remove('active')})
  var panel=document.getElementById('qr-'+mode)
  var btn=document.getElementById('et-'+mode)
  if(panel)panel.classList.add('active')
  if(btn)btn.classList.add('active')
  generate()
}

function getQRData(){
  if(currentMode==='text'){
    return document.getElementById('qr-text-input').value||''
  }else if(currentMode==='wifi'){
    var ssid=document.getElementById('qr-wifi-ssid').value
    var pass=document.getElementById('qr-wifi-pass').value
    var enc=document.getElementById('qr-wifi-enc').value
    if(!ssid)return''
    return'WIFI:T:'+enc+';S:'+ssid+';P:'+pass+';;'
  }else if(currentMode==='vcard'){
    var f=document.getElementById('qr-vcard-first').value
    var l=document.getElementById('qr-vcard-last').value
    if(!f&&!l)return''
    return'BEGIN:VCARD\nVERSION:3.0\nFN:'+f+' '+l+'\nN:'+l+';'+f+';;;\n'+
      (document.getElementById('qr-vcard-phone').value?'TEL:'+document.getElementById('qr-vcard-phone').value+'\n':'')+
      (document.getElementById('qr-vcard-email').value?'EMAIL:'+document.getElementById('qr-vcard-email').value+'\n':'')+
      (document.getElementById('qr-vcard-company').value?'ORG:'+document.getElementById('qr-vcard-company').value+'\n':'')+
      (document.getElementById('qr-vcard-url').value?'URL:'+document.getElementById('qr-vcard-url').value+'\n':'')+
      'END:VCARD'
  }else if(currentMode==='email'){
    var to=document.getElementById('qr-email-to').value
    if(!to)return''
    var subject=document.getElementById('qr-email-subject').value
    var body=document.getElementById('qr-email-body').value
    return'mailto:'+to+'?subject='+encodeURIComponent(subject)+'&body='+encodeURIComponent(body)
  }else if(currentMode==='sms'){
    var phone=document.getElementById('qr-sms-phone').value
    if(!phone)return''
    var msg=document.getElementById('qr-sms-msg').value
    return'smsto:'+phone+':'+msg
  }
  return''
}

function generate(){
  var data=getQRData()
  var canvas=document.getElementById('qr-canvas')
  var status=document.getElementById('qr-status')
  if(!data){
    status.textContent='Enter data to generate QR code…'
    status.style.color='var(--t3)'
    var ctx=canvas.getContext('2d')
    ctx.clearRect(0,0,canvas.width,canvas.height)
    return
  }
  var size=parseInt(document.getElementById('qr-size').value)
  var fg=document.getElementById('qr-fg').value
  var bg=document.getElementById('qr-bg').value
  var ec=document.getElementById('qr-ec').value
  document.getElementById('qr-size-label').textContent=size+'px'
  canvas.width=size;canvas.height=size

  if(typeof QRCode==='undefined'){
    status.textContent='QR library loading…';return
  }
  QRCode.toCanvas(canvas,data,{
    width:size,
    margin:2,
    color:{dark:fg,light:bg},
    errorCorrectionLevel:ec
  },function(err){
    if(err){
      status.textContent='Error: '+err.message
      status.style.color='#f87171'
    }else{
      status.textContent='✓ QR code generated — '+data.length+' chars'
      status.style.color='var(--green)'
    }
  })
}

function downloadPNG(){
  var canvas=document.getElementById('qr-canvas')
  if(!canvas.toDataURL)return
  var a=document.createElement('a')
  a.download='qr-code.png'
  a.href=canvas.toDataURL('image/png')
  a.click()
  toast('PNG downloaded','ok')
}

function downloadSVG(){
  var data=getQRData()
  if(!data){toast('Generate a QR first','err');return}
  if(typeof QRCode==='undefined'){toast('QR library not loaded','err');return}
  QRCode.toString(data,{type:'svg',color:{dark:document.getElementById('qr-fg').value,light:document.getElementById('qr-bg').value},margin:2},function(err,url){
    if(err){toast('SVG error: '+err.message,'err');return}
    var a=document.createElement('a')
    a.download='qr-code.svg'
    a.href='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(url)
    a.click()
    toast('SVG downloaded','ok')
  })
}

function copyQR(){
  var canvas=document.getElementById('qr-canvas')
  canvas.toBlob(function(blob){
    navigator.clipboard.write([new ClipboardItem({'image/png':blob})]).then(function(){toast('QR copied to clipboard','ok')}).catch(function(){toast('Copy not supported in this browser','err')})
  })
}

function toast(msg,type){var e=document.createElement('div');e.className='toast'+(type?' '+type:'');e.textContent=msg;document.getElementById('toasts').appendChild(e);setTimeout(function(){e.remove()},2800)}
</script>
<script>
// GA4 Custom Events — QR Generator
(function(){
  // Track QR type selections
  document.querySelectorAll('.tab,.et,[data-type]').forEach(function(tab){
    tab.addEventListener('click',function(){
      gaEvent('qr_type_selected','QR Generator',this.textContent.trim());
    });
  });
  // Track QR generation
  document.querySelectorAll('button').forEach(function(btn){
    var t=btn.textContent.trim().toLowerCase();
    if(t.includes('generat')||t.includes('creat')||t.includes('build')){
      btn.addEventListener('click',function(){
        gaEvent('qr_generated','QR Generator',document.querySelector('.tab.active,.et.active')?.textContent.trim()||'unknown');
      });
    }
  });
  // Track downloads — most important metric for QR tool
  document.querySelectorAll('[download],[onclick*="download"],[onclick*="Download"],[onclick*="save"],[onclick*="Save"]').forEach(function(el){
    el.addEventListener('click',function(){gaEvent('qr_downloaded','QR Generator','png');});
  });
})();
</script>
